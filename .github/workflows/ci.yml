name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Conventional PR title (becomes the squash commit)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|chore|refactor|test|ci|perf|build|style|revert)(\(.+\))?!?:\ .+ ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat: add login screen'. Got: $TITLE"
            exit 1
          fi

      - name: Validate (same as local hooks)
        run: bash scripts/validate.sh
