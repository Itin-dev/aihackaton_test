name: notify-discord

# Announce merged PRs in Discord. Requires the DISCORD_WEBHOOK_URL repo secret;
# skips silently when it is not set.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGER: ${{ github.event.pull_request.merged_by.login }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping."
            exit 0
          fi
          payload="$(jq -n \
            --arg title "Merged #$NUMBER: $TITLE" \
            --arg url "$URL" \
            --arg desc "by $AUTHOR, merged by $MERGER" \
            '{username: "GitHub", allowed_mentions: {parse: []},
              embeds: [{title: $title, url: $url, description: $desc, color: 5763719}]}')"
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
